<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이어플랜</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Bebas+Neue&display=swap');

:root {
  --bg: #0d0f14;
  --surface: #161922;
  --surface2: #1e2330;
  --surface3: #252b3a;
  --border: #2e3547;
  --border2: #3d4660;
  --accent: #4f8fff;
  --gold: #e8b84b;
  --green: #3dd68c;
  --red: #ff5c5c;
  --muted: #6b7a99;
  --text: #e2e8f5;
  --text2: #a8b4cc;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
  --font: 'Noto Sans KR', sans-serif;
  --mono: 'DM Mono', monospace;
  --display: 'Bebas Neue', cursive;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── LOCK SCREEN ─── */
#lock-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  gap: 32px;
}

.lock-logo {
  font-size: 56px;
  letter-spacing: 0;
  line-height: 1;
  text-shadow: 0 0 40px rgba(255,68,34,0.35);
}

.logo-fire {
  font-family: '궁서', '궁서체', 'GungSeo', serif;
  color: #ff4422;
  letter-spacing: 2px;
}
.logo-plan {
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 600;
  color: #4f8fff;
  letter-spacing: 1px;
}

.lock-subtitle {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.lock-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px;
  width: min(380px, 90vw);
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.lock-label {
  color: var(--text2);
  font-size: 13px;
  margin-bottom: 8px;
}

.pin-display {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--border2);
  background: transparent;
  transition: all 0.2s;
}
.pin-dot.filled {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 12px rgba(79,143,255,0.5);
}

.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.numpad-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 18px;
  font-weight: 500;
  padding: 16px;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--mono);
}
.numpad-btn:hover { background: var(--surface3); border-color: var(--accent); }
.numpad-btn:active { transform: scale(0.95); }
.numpad-btn.del { color: var(--muted); font-size: 14px; }

.lock-msg { text-align: center; font-size: 13px; color: var(--red); min-height: 18px; }
.lock-hint { text-align: center; font-size: 12px; color: var(--muted); }

/* ─── MAIN APP ─── */
#app { display: none; min-height: 100vh; }

/* ─── HEADER ─── */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-actions { display: flex; gap: 8px; align-items: center; }

.btn {
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3a75e8; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-sm { padding: 6px 12px; font-size: 12px; }

/* Minimal styles for now - will expand as needed */
</style>
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock-screen">
  <div class="lock-logo">
    <span class="logo-fire">파이어</span><span class="logo-plan">플랜</span>
  </div>
  <div class="lock-subtitle">Financial Independence</div>
  
  <div class="lock-box">
    <div id="pin-setup" style="display: none;">
      <div class="lock-label">새 PIN 설정 (4자리)</div>
      <div class="pin-display">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div class="lock-msg" id="pin-setup-msg"></div>
    </div>
    
    <div id="pin-confirm" style="display: none;">
      <div class="lock-label">PIN 확인 (4자리)</div>
      <div class="pin-display">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div class="lock-msg" id="pin-confirm-msg"></div>
    </div>
    
    <div id="pin-login" style="display: none;">
      <div class="lock-label">PIN 입력</div>
      <div class="pin-display">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div class="lock-msg" id="pin-login-msg"></div>
      <div class="lock-hint" id="pin-login-hint"></div>
    </div>
    
    <div class="numpad">
      <button class="numpad-btn" onclick="app.pinPress('1')">1</button>
      <button class="numpad-btn" onclick="app.pinPress('2')">2</button>
      <button class="numpad-btn" onclick="app.pinPress('3')">3</button>
      <button class="numpad-btn" onclick="app.pinPress('4')">4</button>
      <button class="numpad-btn" onclick="app.pinPress('5')">5</button>
      <button class="numpad-btn" onclick="app.pinPress('6')">6</button>
      <button class="numpad-btn" onclick="app.pinPress('7')">7</button>
      <button class="numpad-btn" onclick="app.pinPress('8')">8</button>
      <button class="numpad-btn" onclick="app.pinPress('9')">9</button>
      <button class="numpad-btn del" onclick="app.pinClear()">Clear</button>
      <button class="numpad-btn" onclick="app.pinPress('0')">0</button>
      <button class="numpad-btn del" onclick="app.pinBackspace()">⌫</button>
    </div>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app">
  <header class="app-header">
    <div class="lock-logo" style="font-size: 24px;">
      <span class="logo-fire">파이어</span><span class="logo-plan">플랜</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" onclick="app.saveScenario()">💾 저장</button>
      <button class="btn btn-ghost btn-sm" onclick="app.exportData()">📤 내보내기</button>
      <button class="btn btn-ghost btn-sm" onclick="app.importData()">📂 불러오기</button>
      <button class="btn btn-ghost btn-sm" onclick="app.lockApp()">🔒</button>
    </div>
  </header>
  
  <div style="padding: 40px; text-align: center;">
    <h1>파이어플랜 v2.0</h1>
    <p style="color: var(--muted); margin-top: 12px;">JavaScript 재작성 중...</p>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// 파이어플랜 v2.0 - 완전히 새로운 JavaScript
// ═══════════════════════════════════════════════════════════

const SCHEMA_VERSION = 5;
const APP_KEY = 'fireplan_scenarios';
const LAST_KEY = 'fireplan_lastScenario';
const PIN_KEY = 'fireplan_pinHash';
const RECOVERY_KEY = 'fireplan_recoveryHash';

// ═══════════════════════════════════════════════════════════
// 앱 상태
// ═══════════════════════════════════════════════════════════
const app = {
  unlocked: false,
  currentScenario: null,
  scenarios: {},
  pinBuffer: '',
  pinSetup: '',
  pinFailCount: 0,
  
  // ─── 초기화 ───
  init() {
    console.log('[FIREPLAN] Starting v2.0...');
    this.checkFirstRun();
  },
  
  // ─── 최초 실행 체크 ───
  checkFirstRun() {
    const pinHash = localStorage.getItem(PIN_KEY);
    
    if (!pinHash) {
      // 최초 실행 - PIN 설정
      this.showPinSetup();
    } else {
      // 기존 사용자 - PIN 로그인
      this.showPinLogin();
    }
  },
  
  // ─── PIN 설정 화면 ───
  showPinSetup() {
    document.getElementById('pin-setup').style.display = 'block';
    document.getElementById('pin-confirm').style.display = 'none';
    document.getElementById('pin-login').style.display = 'none';
    this.pinBuffer = '';
    this.updatePinDisplay('pin-setup');
  },
  
  showPinConfirm() {
    document.getElementById('pin-setup').style.display = 'none';
    document.getElementById('pin-confirm').style.display = 'block';
    document.getElementById('pin-login').style.display = 'none';
    this.pinBuffer = '';
    this.updatePinDisplay('pin-confirm');
  },
  
  showPinLogin() {
    document.getElementById('pin-setup').style.display = 'none';
    document.getElementById('pin-confirm').style.display = 'none';
    document.getElementById('pin-login').style.display = 'block';
    this.pinBuffer = '';
    this.updatePinDisplay('pin-login');
  },
  
  // ─── PIN 입력 처리 ───
  pinPress(digit) {
    if (this.pinBuffer.length >= 4) {
      // 4자리 완성 후 추가 입력 → 자동 clear 후 새 입력
      this.pinBuffer = digit;
    } else {
      this.pinBuffer += digit;
    }
    
    const activeScreen = this.getActiveScreen();
    this.updatePinDisplay(activeScreen);
    
    // 4자리 완성 시 자동 처리
    if (this.pinBuffer.length === 4) {
      setTimeout(() => this.handlePinComplete(activeScreen), 150);
    }
  },
  
  pinBackspace() {
    if (this.pinBuffer.length > 0) {
      this.pinBuffer = this.pinBuffer.slice(0, -1);
      const activeScreen = this.getActiveScreen();
      this.updatePinDisplay(activeScreen);
    }
  },
  
  pinClear() {
    this.pinBuffer = '';
    const activeScreen = this.getActiveScreen();
    this.updatePinDisplay(activeScreen);
    document.getElementById(activeScreen + '-msg').textContent = '';
  },
  
  // ─── PIN 화면 업데이트 ───
  updatePinDisplay(screen) {
    const dots = document.querySelector(`#${screen} .pin-display`).children;
    for (let i = 0; i < 4; i++) {
      if (i < this.pinBuffer.length) {
        dots[i].classList.add('filled');
      } else {
        dots[i].classList.remove('filled');
      }
    }
  },
  
  getActiveScreen() {
    if (document.getElementById('pin-setup').style.display !== 'none') return 'pin-setup';
    if (document.getElementById('pin-confirm').style.display !== 'none') return 'pin-confirm';
    return 'pin-login';
  },
  
  // ─── PIN 완성 처리 ───
  async handlePinComplete(screen) {
    if (screen === 'pin-setup') {
      // 최초 PIN 설정
      this.pinSetup = this.pinBuffer;
      this.showPinConfirm();
    } 
    else if (screen === 'pin-confirm') {
      // PIN 확인
      if (this.pinBuffer === this.pinSetup) {
        // 일치 - PIN 저장 및 복구 키 생성
        await this.savePinAndRecoveryKey(this.pinSetup);
      } else {
        // 불일치
        document.getElementById('pin-confirm-msg').textContent = 'PIN이 일치하지 않습니다';
        setTimeout(() => {
          this.pinSetup = '';
          this.showPinSetup();
        }, 1500);
      }
    }
    else if (screen === 'pin-login') {
      // 로그인
      await this.verifyPin(this.pinBuffer);
    }
  },
  
  // ─── PIN 저장 및 복구 키 생성 ───
  async savePinAndRecoveryKey(pin) {
    const pinHash = await this.hashString(pin);
    const recoveryKey = this.generateRecoveryKey();
    const recoveryHash = await this.hashString(recoveryKey);
    
    localStorage.setItem(PIN_KEY, pinHash);
    localStorage.setItem(RECOVERY_KEY, recoveryHash);
    
    // 복구 키 표시 (한 번만)
    alert(`복구 키가 생성되었습니다. 안전한 곳에 보관하세요:\n\n${recoveryKey}\n\n이 키는 다시 표시되지 않습니다!`);
    
    // 앱 잠금 해제
    this.unlocked = true;
    this.showApp();
  },
  
  // ─── PIN 검증 ───
  async verifyPin(pin) {
    const pinHash = await this.hashString(pin);
    const storedHash = localStorage.getItem(PIN_KEY);
    
    if (pinHash === storedHash) {
      // 로그인 성공
      this.pinFailCount = 0;
      this.unlocked = true;
      this.loadScenarios();
      this.showApp();
    } else {
      // 로그인 실패
      this.pinFailCount++;
      this.pinBuffer = '';
      this.updatePinDisplay('pin-login');
      
      if (this.pinFailCount >= 3) {
        document.getElementById('pin-login-msg').textContent = 'PIN 3회 실패';
        document.getElementById('pin-login-hint').textContent = '복구 키 또는 앱 초기화 필요';
        // TODO: 복구 키 입력 또는 초기화 옵션 표시
      } else {
        document.getElementById('pin-login-msg').textContent = `PIN이 틀렸습니다 (${this.pinFailCount}/3)`;
      }
    }
  },
  
  // ─── SHA-256 해시 ───
  async hashString(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  },
  
  // ─── 복구 키 생성 (12자리) ───
  generateRecoveryKey() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 혼동 문자 제외
    let key = '';
    for (let i = 0; i < 12; i++) {
      key += chars[Math.floor(Math.random() * chars.length)];
      if ((i + 1) % 4 === 0 && i < 11) key += '-';
    }
    return key;
  },
  
  // ─── 시나리오 로드 ───
  loadScenarios() {
    const data = localStorage.getItem(APP_KEY);
    if (data) {
      try {
        this.scenarios = JSON.parse(data);
      } catch (e) {
        console.error('[LOAD] 시나리오 파싱 실패:', e);
        this.scenarios = {};
      }
    }
    
    // 마지막 시나리오 로드
    const lastId = localStorage.getItem(LAST_KEY);
    if (lastId && this.scenarios[lastId]) {
      this.currentScenario = this.scenarios[lastId];
    } else if (Object.keys(this.scenarios).length > 0) {
      const firstId = Object.keys(this.scenarios)[0];
      this.currentScenario = this.scenarios[firstId];
    }
  },
  
  // ─── 앱 표시 ───
  showApp() {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    console.log('[APP] Unlocked');
  },
  
  // ─── 앱 잠금 ───
  lockApp() {
    this.unlocked = false;
    this.currentScenario = null;
    this.pinBuffer = '';
    this.pinFailCount = 0;
    document.getElementById('app').style.display = 'none';
    this.showPinLogin();
    console.log('[APP] Locked');
  },
  
  // ─── 저장 (TODO) ───
  saveScenario() {
    alert('저장 기능 구현 예정');
  },
  
  // ─── 내보내기 (TODO) ───
  exportData() {
    alert('내보내기 기능 구현 예정');
  },
  
  // ─── 불러오기 (TODO) ───
  importData() {
    alert('불러오기 기능 구현 예정');
  }
};

// ═══════════════════════════════════════════════════════════
// 앱 시작
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  app.init();
});
</script>

</body>
</html>
